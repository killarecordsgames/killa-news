name: Verifica feed
on:
  push:
    branches: [verifica-feed]
jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install feedparser requests
      - run: python verifica.py
