name: Giornale parlato
on:
  schedule:
    - cron: '20 5 * * *'   # ogni mattina verso le 6:20 ora italiana (GitHub può ritardare un po')
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['podcast/giornale_parlato.py', '.github/workflows/giornale-parlato.yml']
permissions:
  contents: write
concurrency:
  group: giornale-parlato
  cancel-in-progress: false
jobs:
  puntata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recupera le puntate già pubblicate
        run: |
          git fetch origin gh-pages --depth=1 && git worktree add --detach pagine origin/gh-pages || mkdir -p pagine
          mkdir -p pagine/podcast
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Installa Piper e la voce
        run: |
          (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg) >/dev/null || (sleep 20; sudo apt-get update -qq; sudo apt-get install -y -qq --fix-missing ffmpeg >/dev/null)
          pip install -q piper-tts feedparser numpy
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/it/it_IT/paola/medium
          curl -fsSL -o paola.onnx $base/it_IT-paola-medium.onnx
          curl -fsSL -o paola.onnx.json $base/it_IT-paola-medium.onnx.json
      - name: Crea la puntata di oggi
        env: { PIPER_MODELLO: paola.onnx }
        run: |
          cp podcast/copertina.png pagine/podcast/copertina.png
          python podcast/giornale_parlato.py pagine/podcast
      - name: Pubblica (ramo gh-pages, solo le ultime 30 puntate)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cd pagine
          rm -rf .git
          touch .nojekyll
          printf '<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=https://www.killarecordsgames.com/giornale-parlato"><title>Il giornale parlato di KILLA NEWS</title><a href="https://www.killarecordsgames.com/giornale-parlato">Il giornale parlato di KILLA NEWS</a>' > index.html
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Giornale parlato $(date +%F)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:gh-pages
      - name: Pubblica il giornale nel gruppo Telegram Killa Radio
        run: |
          # GitHub Pages impiega circa un minuto a mettere online la puntata nuova
          for i in 1 2 3 4 5; do
            sleep 90
            esito=$(curl -s "https://srkepkkkwrmutzcecrdw.supabase.co/functions/v1/killa-news-telegram?mattino=1")
            echo "$esito"
            case "$esito" in *pubblicato*|*Già*) break;; esac
          done
