name: Prova bot Telegram
on:
  push:
    branches: [main]
    paths: ['tools/prova_bot.ts', 'supabase/killa-news-telegram/**']
  workflow_dispatch:
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno run --allow-net --allow-env tools/prova_bot.ts
